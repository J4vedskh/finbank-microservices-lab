openapi: 3.0.3
info:
  title: FinBank Microservices API
  version: 0.2.0
  description: Contract sketch for the account, payment, and transaction services.
servers:
  - url: http://localhost:8081
    description: Account Service
  - url: http://localhost:8082
    description: Payment Service
  - url: http://localhost:8083
    description: Transaction Service
tags:
  - name: Accounts
  - name: Payments
  - name: Payment Operations
  - name: Transactions
paths:
  /accounts:
    get:
      tags: [Accounts]
      summary: List accounts
      responses:
        "200":
          description: Accounts returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      tags: [Accounts]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: Customer name or opening balance failed validation
  /payments:
    get:
      tags: [Payments]
      summary: List payments
      responses:
        "200":
          description: Payments returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      tags: [Payments]
      summary: Create a payment and queue its event for publication
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Opaque case-sensitive key for safely replaying this request.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[!-~]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "200":
          description: Payment created with durable event publication queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          description: Idempotency key or payment request failed validation
        "409":
          description: Idempotency key was already used for a different payment
  /internal/payment-outbox/{eventId}/recovery:
    post:
      tags: [Payment Operations]
      summary: Re-arm an exhausted payment outbox event
      description: >-
        Restricted operator command. The authenticated principal is recorded as
        the audit actor. An exact command replay returns the original receipt.
        The application requires the request to arrive through its HTTPS connector.
      servers:
        - url: https://localhost:8082
          description: Payment Service with its HTTPS connector enabled
      security:
        - recoveryOperator: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: Idempotency-Key
          in: header
          required: true
          description: High-entropy command key; the service stores only its SHA-256 digest.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[!-~]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentOutboxRecoveryRequest"
      responses:
        "200":
          description: Recovery accepted or the exact prior command replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOutboxRecoveryResponse"
        "400":
          description: Event id, command key, or reason failed validation
        "401":
          description: Recovery operator credentials are missing or invalid
        "403":
          description: Authenticated identity lacks the recovery authority
        "404":
          description: Outbox event was not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Event is ineligible or the command key conflicts
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /transactions:
    get:
      tags: [Transactions]
      summary: List transactions
      responses:
        "200":
          description: Transactions returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
  /transactions/account/{id}:
    get:
      tags: [Transactions]
      summary: List transactions involving one account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Matching transactions returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
components:
  securitySchemes:
    recoveryOperator:
      type: http
      scheme: basic
      description: >-
        Dedicated operator credential supplied through runtime configuration.
        The Spring Boot TLS connector must be enabled before credentials activate.
  schemas:
    Account:
      type: object
      description: Persisted account; the service assigns the account id.
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        customerName:
          type: string
          example: Asha Mehta
        balance:
          type: number
          format: decimal
          example: 5000.00
    CreateAccountRequest:
      type: object
      description: Client input for account creation; the service assigns the account id.
      required: [customerName, balance]
      properties:
        customerName:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Must contain at least one non-whitespace character.
          example: Asha Mehta
        balance:
          type: number
          format: decimal
          minimum: 0
          example: 5000.00
    Payment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fromAccount:
          type: integer
          format: int64
        toAccount:
          type: integer
          format: int64
        amount:
          type: number
          format: decimal
        status:
          type: string
          enum: [CREATED, PENDING_RETRY, PUBLISHED, PUBLISH_EXHAUSTED]
          example: CREATED
    CreatePaymentRequest:
      type: object
      description: Client input for a payment; the service assigns the payment id and status.
      required: [fromAccount, toAccount, amount]
      properties:
        fromAccount:
          type: integer
          format: int64
          minimum: 1
          example: 1
        toAccount:
          type: integer
          format: int64
          minimum: 1
          description: Must identify an account different from `fromAccount`.
          example: 2
        amount:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          example: 750.00
    PaymentOutboxRecoveryRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '.*\S.*'
          description: >-
            Non-sensitive operational reason retained in the audit record.
            Must not contain credentials, tokens, payloads, personal data, or secrets.
    PaymentOutboxRecoveryResponse:
      type: object
      required: [eventId, requeuedAt]
      properties:
        eventId:
          type: integer
          format: int64
        requeuedAt:
          type: string
          format: date-time
    Problem:
      type: object
      properties:
        status:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
    Transaction:
      type: object
      properties:
        id:
          type: integer
          format: int64
        paymentId:
          type: integer
          format: int64
          description: Payment event identity used to make ledger writes idempotent.
        fromAccount:
          type: integer
          format: int64
        toAccount:
          type: integer
          format: int64
        amount:
          type: number
          format: decimal
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          example: COMPLETED
