openapi: 3.0.3
info:
  title: FinBank Microservices API
  version: 0.7.0
  description: Curated aggregate contract for the account, payment, and transaction services.
tags:
  - name: Accounts
  - name: Payments
  - name: Payment Operations
  - name: Transactions
paths:
  /accounts:
    servers:
      - url: http://localhost:8081
        description: Account Service
    get:
      operationId: listAccounts
      tags: [Accounts]
      summary: List accounts
      responses:
        "200":
          description: Accounts returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
              examples:
                populated:
                  summary: Synthetic account list
                  value:
                    - id: 101
                      customerName: Demo Sender
                      balance: 5000.00
                    - id: 202
                      customerName: Demo Recipient
                      balance: 2500.00
                empty:
                  summary: No accounts stored
                  value: []
    post:
      operationId: createAccount
      tags: [Accounts]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
              examples:
                created:
                  summary: Synthetic newly created account
                  value:
                    id: 101
                    customerName: Demo Customer
                    balance: 5000.00
        "400":
          description: Customer name or opening balance failed validation
  /payments:
    servers:
      - url: http://localhost:8082
        description: Payment Service
    get:
      operationId: listPayments
      tags: [Payments]
      summary: List payments
      responses:
        "200":
          description: Payments returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
              examples:
                populated:
                  summary: Synthetic payment after successful publication
                  value:
                    - id: 201
                      fromAccount: 101
                      toAccount: 202
                      amount: 750.00
                      status: PUBLISHED
                empty:
                  summary: No payments stored
                  value: []
    post:
      operationId: createPayment
      tags: [Payments]
      summary: Create a payment and queue its event for publication
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Opaque case-sensitive key for safely replaying this request.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[!-~]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "200":
          description: Payment created with durable event publication queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
              examples:
                created:
                  summary: Synthetic payment with publication queued
                  value:
                    id: 201
                    fromAccount: 101
                    toAccount: 202
                    amount: 750.00
                    status: CREATED
        "400":
          description: Idempotency key or payment request failed validation
        "409":
          description: Idempotency key was already used for a different payment
  /internal/payment-outbox/{eventId}/recovery:
    post:
      operationId: recoverPaymentOutboxEvent
      tags: [Payment Operations]
      summary: Re-arm an exhausted payment outbox event
      description: >-
        Restricted operator command. The authenticated principal is recorded as
        the audit actor. An exact command replay returns the original receipt.
        The request must arrive through direct application TLS or the explicit,
        exact-address trusted-proxy transport boundary. Forwarding metadata is
        deployment-supplied and is not a client-controlled API parameter.
        In JWT mode the token requires payment.outbox.recovery scope.
        Business-level not-found, ineligible, and command-conflict rejections are
        journaled using only requested event id, fixed code, and server timestamp.
      servers:
        - url: https://localhost:8082
          description: Payment Service at its secure operator boundary
      security:
        - recoveryOperator: []
        - operatorBearer: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: Idempotency-Key
          in: header
          required: true
          description: High-entropy command key; the service stores only its SHA-256 digest.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[!-~]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentOutboxRecoveryRequest"
      responses:
        "200":
          description: Recovery accepted or the exact prior command replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOutboxRecoveryResponse"
        "400":
          description: Event id, command key, or reason failed validation; not business-audited
        "401":
          description: Active-mode Basic credentials or Bearer token are missing or invalid; not business-audited
        "403":
          description: Authenticated identity lacks recovery authority; not business-audited
        "404":
          description: Outbox event was not found and the business rejection was journaled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Event is ineligible or the command conflicts; rejection was journaled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Business rejection could not be journaled, so its original outcome is withheld
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /internal/payment-outbox/dead-letter-handoffs:
    get:
      operationId: listPaymentOutboxDeadLetterHandoffs
      tags: [Payment Operations]
      summary: Inspect retained local dead-letter handoffs
      description: >-
        Restricted, read-only inspection of immutable local terminal-publication
        handoffs. Results contain only safe handoff metadata and use an exclusive
        primary-key cursor. A handoff proves local database staging only; it is
        not a Kafka DLT publication, external-delivery acknowledgement, or
        downstream consumer receipt. In JWT mode the token requires
        payment.outbox.handoff-inspection scope. The request must arrive through
        direct application TLS or the explicit, exact-address trusted-proxy
        transport boundary.
      servers:
        - url: https://localhost:8082
          description: Payment Service at its secure operator boundary
      security:
        - handoffInspectionOperator: []
        - operatorBearer: []
      parameters:
        - name: afterId
          in: query
          required: false
          description: Return handoffs with an id strictly greater than this cursor.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          required: false
          description: Maximum handoffs returned; one extra row determines the next cursor.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Bounded handoff page returned in ascending handoff-id order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOutboxDeadLetterHandoffPage"
        "400":
          description: Cursor or limit failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Operator credentials are missing or invalid
        "403":
          description: Authenticated identity lacks handoff-inspection authority
  /transactions:
    servers:
      - url: http://localhost:8083
        description: Transaction Service
    get:
      operationId: listTransactions
      tags: [Transactions]
      summary: List transactions
      responses:
        "200":
          description: Transactions returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
              examples:
                populated:
                  summary: Synthetic completed ledger entry
                  value:
                    - id: 301
                      paymentId: 201
                      fromAccount: 101
                      toAccount: 202
                      amount: 750.00
                      createdAt: "2026-01-15T10:30:00Z"
                      status: COMPLETED
                empty:
                  summary: No transactions stored
                  value: []
  /transactions/account/{id}:
    servers:
      - url: http://localhost:8083
        description: Transaction Service
    get:
      operationId: listTransactionsByAccount
      tags: [Transactions]
      summary: List transactions involving one account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Matching transactions returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
              examples:
                matchingAccount:
                  summary: Synthetic ledger entry involving the requested account
                  value:
                    - id: 301
                      paymentId: 201
                      fromAccount: 101
                      toAccount: 202
                      amount: 750.00
                      createdAt: "2026-01-15T10:30:00Z"
                      status: COMPLETED
                empty:
                  summary: No transactions involve the requested account
                  value: []
components:
  securitySchemes:
    recoveryOperator:
      type: http
      scheme: basic
      description: >-
        Local Basic operator credential selected only in basic mode and supplied
        through runtime configuration. Activation requires either the direct TLS
        connector or the explicit trusted-proxy transport mode.
    handoffInspectionOperator:
      type: http
      scheme: basic
      description: >-
        Configured local Basic operator credential with
        PAYMENT_OUTBOX_HANDOFF_INSPECTION authority. The current operator also
        has recovery authority; JWT mode can separate the roles through exact
        scopes.
    operatorBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        External RS256 JWT selected instead of Basic authentication. Tokens are
        issuer-, audience-, and subject-validated, require iat and exp, and honor
        nbf when present with 60 seconds of clock-skew tolerance. Standard scope
        and scp claims are accepted. Only the documented payment.outbox.recovery
        and payment.outbox.handoff-inspection scopes map to operator authorities.
  schemas:
    Account:
      type: object
      description: Persisted account; the service assigns the account id.
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 101
        customerName:
          type: string
          description: Customer display name accepted by the account creation API.
          example: Demo Customer
        balance:
          type: number
          format: decimal
          description: Current account balance represented as a decimal number.
          example: 5000.00
    CreateAccountRequest:
      type: object
      description: Client input for account creation; the service assigns the account id.
      required: [customerName, balance]
      properties:
        customerName:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Must contain at least one non-whitespace character.
          example: Demo Customer
        balance:
          type: number
          format: decimal
          minimum: 0
          example: 5000.00
    Payment:
      type: object
      description: >-
        Persisted payment state returned by the payment service. The internal
        idempotency-key digest is never serialized.
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 201
        fromAccount:
          type: integer
          format: int64
          minimum: 1
          example: 101
        toAccount:
          type: integer
          format: int64
          minimum: 1
          example: 202
        amount:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          example: 750.00
        status:
          type: string
          readOnly: true
          enum: [CREATED, PENDING_RETRY, PUBLISHED, PUBLISH_EXHAUSTED]
          description: >-
            Server-owned publication lifecycle state; a successful create starts
            at CREATED and the outbox relay advances it later.
          example: CREATED
    CreatePaymentRequest:
      type: object
      description: Client input for a payment; the service assigns the payment id and status.
      required: [fromAccount, toAccount, amount]
      properties:
        fromAccount:
          type: integer
          format: int64
          minimum: 1
          example: 1
        toAccount:
          type: integer
          format: int64
          minimum: 1
          description: Must identify an account different from `fromAccount`.
          example: 2
        amount:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          example: 750.00
    PaymentOutboxRecoveryRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '.*\S.*'
          description: >-
            Non-sensitive operational reason retained in the audit record.
            Must not contain credentials, tokens, payloads, personal data, or secrets.
    PaymentOutboxRecoveryResponse:
      type: object
      required: [eventId, requeuedAt]
      properties:
        eventId:
          type: integer
          format: int64
        requeuedAt:
          type: string
          format: date-time
    PaymentOutboxDeadLetterHandoffPage:
      type: object
      required: [handoffs, nextCursor]
      properties:
        handoffs:
          type: array
          items:
            $ref: "#/components/schemas/PaymentOutboxDeadLetterHandoffSummary"
        nextCursor:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: >-
            Last returned handoff id when another row was observed for this
            request; otherwise null. New terminal cycles can appear later.
    PaymentOutboxDeadLetterHandoffSummary:
      type: object
      required:
        - handoffId
        - eventId
        - exhaustionSequence
        - exhaustedAt
        - attemptCount
        - failureType
      properties:
        handoffId:
          type: integer
          format: int64
          minimum: 1
        eventId:
          type: integer
          format: int64
          minimum: 1
        exhaustionSequence:
          type: integer
          format: int32
          minimum: 1
        exhaustedAt:
          type: string
          format: date-time
        attemptCount:
          type: integer
          format: int32
          minimum: 0
        failureType:
          type: string
          nullable: true
          description: Sanitized exception class name; exception messages are never returned.
    Problem:
      type: object
      properties:
        status:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
    Transaction:
      type: object
      description: Read-only ledger entry derived from a validated payment event.
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 301
        paymentId:
          type: integer
          format: int64
          minimum: 1
          description: Payment event identity used to make ledger writes idempotent.
          example: 201
        fromAccount:
          type: integer
          format: int64
          minimum: 1
          example: 101
        toAccount:
          type: integer
          format: int64
          minimum: 1
          example: 202
        amount:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          example: 750.00
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-01-15T10:30:00Z"
        status:
          type: string
          readOnly: true
          description: Ledger processing state assigned by the transaction service.
          example: COMPLETED
